<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>The Prophet · Superpower Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#e8c25a;
    --green-soft:rgba(232,194,90,.38);
    --green-faint:rgba(232,194,90,.14);
    --bg:#0a0a0a;
    --panel:rgba(18,14,6,.8);
    --text:#f3e9d2;
    --muted:#b39b63;
    --danger:#ff4d6d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;overflow-x:hidden}
  /* Fixed to the LARGE viewport height so the mobile URL bar showing/hiding never needs a resize. */
  #rain-canvas{position:fixed;inset:0;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:0;display:block;pointer-events:none}

  .wrap{
    position:relative;z-index:1;min-height:100vh;min-height:100svh;
    max-width:1200px;margin:0 auto;padding:32px 24px;
    padding:max(32px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
    display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,560px);
    gap:40px;align-items:center;
  }

  /* ---------- Hero ---------- */
  .hero{text-align:center}
  .hero-frame{position:relative;display:inline-block;width:min(100%,420px)}
  .hero-frame img{width:100%;height:auto;display:block}
  .hero-fallback{display:none;align-items:center;justify-content:center;aspect-ratio:1/1;
    font-family:'Orbitron',sans-serif;font-size:64px;color:var(--green);text-shadow:0 0 20px var(--green)}
  .hero h1{
    margin-top:24px;font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(22px,3.4vw,38px);letter-spacing:.08em;white-space:nowrap;color:var(--green);
    background:linear-gradient(180deg,#fff3c4 0%,#e8c25a 45%,#a8761e 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 14px rgba(232,194,90,.45));
  }
  .hero p{color:var(--muted);letter-spacing:.3em;text-transform:uppercase;font-size:14px;margin-top:6px}

  /* ---------- Chat ---------- */
  .chat{
    background:var(--panel);border:1px solid var(--green-soft);border-radius:14px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 0 30px var(--green-faint),inset 0 0 30px var(--green-faint);
    display:flex;flex-direction:column;height:min(78vh,680px);overflow:hidden;
  }
  .chat-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--green-faint)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .dot.off{background:var(--danger);box-shadow:0 0 10px var(--danger)}
  .chat-head strong{font-family:'Orbitron',sans-serif;letter-spacing:.1em;font-size:14px}
  .chat-head span{margin-left:auto;color:var(--muted);font-size:12px}
  .chat-body{flex:1;min-height:0;display:flex;flex-direction:column}
  .chat-arrow{display:none;color:var(--green);font-size:16px;transition:transform .2s}
  .chat-new{display:none;font-size:10px;letter-spacing:.15em;color:#1a1203;background:var(--green);border-radius:6px;padding:2px 6px;box-shadow:0 0 10px var(--green);animation:blink 1.4s steps(1) infinite}
  .chat-new.on{display:inline-block}

  .log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--green-soft) transparent}
  .msg{max-width:85%;padding:10px 14px;border-radius:10px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
  .msg.assistant{align-self:flex-start;background:rgba(232,194,90,.08);border:1px solid var(--green-faint)}
  .msg.assistant::before{content:'PROPHET › ';color:var(--green)}
  .msg.user{align-self:flex-end;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
  .msg.system{align-self:center;color:var(--danger);font-size:13px;border:1px dashed rgba(255,77,109,.4)}

  .power-card{
    align-self:stretch;border:1px solid var(--green);border-radius:12px;padding:14px 16px;
    background:linear-gradient(135deg,rgba(232,194,90,.14),rgba(0,0,0,.45));
    box-shadow:0 0 18px var(--green-faint);
  }
  .power-card .label{font-size:11px;letter-spacing:.3em;color:var(--muted)}
  .power-card h3{font-family:'Orbitron',sans-serif;color:var(--green);margin:4px 0 8px;font-size:18px}
  .power-card p{font-size:14px;line-height:1.5;margin-bottom:6px}
  .power-card .meta{color:var(--muted);font-size:13px}
  .power-card button{margin-top:10px}
  .power-card .field{display:block;font-size:11px;letter-spacing:.2em;color:var(--muted);margin-top:8px}
  .power-card input,.power-card textarea{
    display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;
    background:rgba(0,0,0,.55);color:var(--text);border:1px solid var(--green-soft);font:inherit;font-size:15px;outline:none;
  }
  .power-card input{font-family:'Orbitron',sans-serif;color:var(--green);font-size:16px}
  .power-card textarea{resize:vertical;min-height:64px;max-height:220px;line-height:1.45}
  .power-card input:focus,.power-card textarea:focus{border-color:var(--green);box-shadow:0 0 12px var(--green-soft)}
  .power-card input:disabled,.power-card textarea:disabled{opacity:.75}
  .power-card .count{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
  .power-card .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:0}
  .power-card .err:empty{display:none}
  .power-card .actions{display:flex;flex-wrap:wrap;gap:10px}
  .power-card .actions button{margin-top:10px}
  .power-card.saved{border-color:var(--green-soft)}

  .chat-tools{display:flex;justify-content:flex-end;padding:8px 14px 0;border-top:1px solid var(--green-faint)}
  .chat-tools button{min-height:34px;font-size:11px;padding:0 14px}
  .chat-tools + form.input{border-top:none}

  .matches{align-self:stretch;border:1px dashed var(--green-soft);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.35)}
  .matches .label{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:8px}
  .matches .match{border:1px solid var(--green-faint);border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer;background:rgba(232,194,90,.05)}
  .matches .match:hover,.matches .match:focus-visible{border-color:var(--green);outline:none}
  .matches .match h4{color:var(--green);font-size:14px;margin-bottom:2px}
  .matches .match p{font-size:13px;line-height:1.4;opacity:.85}

  .typing{align-self:flex-start;color:var(--muted);font-size:14px}
  .typing::after{content:'▋';animation:blink 1s steps(1) infinite;margin-left:4px;color:var(--green)}
  @keyframes blink{50%{opacity:0}}

  form.input{display:flex;gap:10px;padding:14px;border-top:1px solid var(--green-faint)}
  form.input textarea{
    flex:1;resize:none;height:46px;max-height:140px;padding:12px 14px;border-radius:10px;
    background:rgba(0,0,0,.55);color:var(--text);border:1px solid var(--green-soft);
    font:inherit;font-size:15px;outline:none;
  }
  form.input textarea:focus{border-color:var(--green);box-shadow:0 0 12px var(--green-soft)}
  button{
    font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.12em;cursor:pointer;
    background:linear-gradient(180deg,#f5d77e,#c99a35);color:#1a1203;border:none;border-radius:10px;padding:0 18px;min-height:40px;
    box-shadow:0 0 14px var(--green-soft);transition:transform .1s,box-shadow .2s;
  }
  button:hover{box-shadow:0 0 24px var(--green)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  button.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}

  /* ---------- Vault ---------- */
  .vault{grid-column:1/-1;background:var(--panel);border:1px solid var(--green-soft);border-radius:14px;padding:18px;backdrop-filter:blur(6px)}
  .vault-toggle{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:transparent;color:var(--green);border:none;box-shadow:none;padding:4px 2px;min-height:44px;
    font-family:'Orbitron',sans-serif;font-size:16px;letter-spacing:.15em;text-align:left;border-radius:8px;
  }
  .vault-toggle:hover{box-shadow:none;text-shadow:0 0 12px var(--green)}
  .vault-toggle:focus-visible{outline:2px solid var(--green);outline-offset:4px}
  .vault-toggle .arrow{display:inline-block;transition:transform .2s;font-size:18px}
  .vault-toggle[aria-expanded="true"] .arrow{transform:rotate(180deg)}
  .vault-body{margin-top:14px}
  .vault-body[hidden]{display:none}
  .vault-tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .vault-tools input{
    flex:1 1 220px;min-width:0;min-height:40px;padding:0 14px;border-radius:10px;
    background:rgba(0,0,0,.55);color:var(--text);border:1px solid var(--green-soft);font:inherit;font-size:15px;outline:none;
  }
  .vault-tools input:focus{border-color:var(--green);box-shadow:0 0 12px var(--green-soft)}
  .vault-status{color:var(--muted);font-size:13px;margin-bottom:10px;min-height:1em}
  .vault-more{display:flex;justify-content:center;margin-top:14px}
  .vault-more button[hidden]{display:none}
  .vault-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .vault-item{border:1px solid var(--green-faint);border-radius:10px;padding:12px;background:rgba(0,0,0,.4)}
  .vault-item h4{color:var(--green);font-size:15px;margin-bottom:6px}
  .vault-item p{font-size:13px;color:var(--text);opacity:.85;line-height:1.45}
  .vault-item .meta{font-size:12px;color:var(--muted);margin-top:6px}
  .empty{color:var(--muted);font-size:14px}

  @media (max-width:860px){
    .wrap{
      grid-template-columns:minmax(0,1fr);gap:24px;align-items:start;
      padding:24px 16px;
      padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    }
    .hero-frame{width:min(55vw,200px)}
    .hero h1{margin-top:14px;white-space:normal;overflow-wrap:break-word;font-size:clamp(22px,7vw,34px)}
    .hero p{font-size:12px;letter-spacing:.25em}
    .chat{height:70vh;height:min(70dvh,560px);min-height:360px}
    .chat-head[role="button"]{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
    .chat-head[role="button"]:focus-visible{outline:2px solid var(--green);outline-offset:-4px;border-radius:14px}
    .chat-head[role="button"] .chat-arrow{display:inline-block}
    .chat-head[aria-expanded="true"] .chat-arrow{transform:rotate(180deg)}
    .chat.collapsed{height:auto;min-height:0}
    .chat.collapsed .chat-head{border-bottom:none}
    .chat.collapsed .chat-body{display:none}
    .msg{max-width:90%}
    form.input{padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
    form.input textarea{font-size:16px}           /* 16px+ stops iOS zoom on focus */
    form.input button{min-height:46px;min-width:76px}
    .chat-tools button{min-height:40px}
    .power-card input,.power-card textarea{font-size:16px}   /* no iOS zoom */
    .vault{padding:14px}
    .vault-toggle{font-size:14px}
    .vault-tools input{font-size:16px;min-height:44px}
    .vault-tools button{flex:1 1 auto;min-height:44px}
    .vault-more button{min-height:44px;min-width:160px}
    .vault-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
  }
  @media (max-width:480px){
    .wrap{gap:18px}
    .hero-frame{width:min(50vw,180px)}
    .hero h1{letter-spacing:.05em}
    .hero p{letter-spacing:.2em}
    .chat-head{flex-wrap:wrap;gap:6px 10px;padding:12px 14px}
    .chat-head strong{font-size:12px}
    .chat-head span{font-size:11px}
    .chat-head[role="button"] .chat-new{order:3}
    .chat-head[role="button"] .chat-arrow{order:4;margin-left:auto}
    .chat-head[role="button"] #status-text{order:5;flex-basis:100%;margin-left:20px}
    .log{padding:14px 12px}
    .msg{font-size:15px;padding:9px 12px}
    form.input{gap:8px}
    form.input textarea{padding:12px}
    form.input textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vault-toggle{font-size:13px;letter-spacing:.1em}
    .vault-tools input{flex:1 1 100%}
    .vault-tools button{flex:1 1 0}
    .vault-grid{grid-template-columns:minmax(0,1fr)}
    .power-card h3{font-size:16px}
    .power-card{padding:12px}
    .power-card .actions button{flex:1 1 0;min-height:44px}
    .chat-tools{padding:8px 12px 0}
    .chat-tools button{flex:1 1 auto}
  }
</style>
</head>
<body>
<canvas id="rain-canvas"></canvas>

<main class="wrap">
  <section class="hero">
    <div class="hero-frame">
      <img src="xach.png" alt="The Prophet" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="hero-fallback">P</div>
    </div>
    <h1>THE PROPHET</h1>
    <p>Superpower Creator</p>
  </section>

  <section class="chat" aria-label="Chat with The Prophet">
    <header class="chat-head">
      <div class="dot" id="status-dot"></div>
      <strong>THE PROPHET // ONLINE</strong>
      <span id="status-text">secure channel</span>
      <em class="chat-new" id="chat-new" aria-hidden="true">NEW</em>
      <b class="chat-arrow" aria-hidden="true">▾</b>
    </header>
    <div class="chat-body" id="chat-body">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chat-tools"><button class="ghost" id="add-own" type="button">+ ADD YOUR OWN POWER</button></div>
    <form class="input" id="chat-form">
      <textarea id="chat-input" placeholder="Describe the power you want..." rows="1" maxlength="2000"></textarea>
      <button type="submit" id="send-btn">SEND</button>
    </form>
    </div>
  </section>

  <section class="vault" aria-label="Saved superpowers">
    <button class="vault-toggle" id="vault-toggle" type="button" aria-expanded="false" aria-controls="vault-body">
      <span>POWER VAULT <span id="vault-count"></span></span>
      <span class="arrow" aria-hidden="true">▾</span>
    </button>
    <div class="vault-body" id="vault-body" hidden>
      <div class="vault-tools">
        <input type="search" id="vault-search" placeholder="Search the vault..." maxlength="60" aria-label="Search powers" autocomplete="off">
        <button class="ghost" id="shuffle-vault" type="button">SHUFFLE</button>
        <button class="ghost" id="refresh-vault" type="button">REFRESH</button>
      </div>
      <div class="vault-status" id="vault-status" aria-live="polite"></div>
      <div class="vault-grid" id="vault-grid"></div>
      <div class="vault-more"><button class="ghost" id="vault-more" type="button" hidden>LOAD MORE</button></div>
    </div>
  </section>
</main>

<script>
  // ====== CONFIG: point this at your Cloudflare Worker ======
  const API_BASE = 'https://prophet-api.prophetapi.workers.dev';

  // Matrix Rain
  // Mobile-safe: the canvas is sized to the tallest viewport once, and only rebuilds when the
  // WIDTH changes (rotation / desktop resize). Hiding/showing the URL bar while scrolling only
  // changes the height, so the rain just keeps flowing.
  const rainCanvas = document.getElementById('rain-canvas');
  const ctx = rainCanvas.getContext('2d');
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:\'",.<>?/～!！@#￥%……&*（）——+【】｛｝；：＂＇，。、《》？';
  const fontSize = 14;
  const STEP_MS = 110;                 // higher = slower rain
  const REDUCED_STEP_MS = 1200;        // prefers-reduced-motion: slow drift
  const motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  let drops = [];
  let rainW = 0, rainH = 0, glow = 18;

  function rainHeight() {
    return Math.max(window.innerHeight, (window.screen && screen.height) || 0, rainCanvas.clientHeight || 0);
  }
  function randomRow() { return Math.floor(Math.random() * (rainH / fontSize)); }

  function sizeRain() {
    const w = window.innerWidth;
    const h = Math.max(rainHeight(), rainH);   // never shrink the height
    if (w === rainW && h === rainH) return false;
    const first = rainW === 0;
    let snapshot = null;
    if (!first) {                               // keep what's already drawn
      snapshot = document.createElement('canvas');
      snapshot.width = rainCanvas.width; snapshot.height = rainCanvas.height;
      snapshot.getContext('2d').drawImage(rainCanvas, 0, 0);
    }
    rainW = w; rainH = h;
    rainCanvas.width = w; rainCanvas.height = h;  // (this clears the bitmap)
    rainCanvas.style.height = h + 'px';
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, w, h);
    if (snapshot) ctx.drawImage(snapshot, 0, 0);
    glow = w <= 480 ? 10 : 18;                   // lighter glow on phones (performance)
    const cols = Math.floor(w / fontSize);
    if (cols < drops.length) drops.length = cols;  // narrower: drop extra columns
    while (drops.length < cols) drops.push(randomRow()); // wider: new columns already mid-fall
    return first;
  }

  function drawRain() {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
    ctx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);
    ctx.fillStyle = '#00ff88';           // green characters
    ctx.shadowColor = '#1e90ff';         // bluish glow
    ctx.shadowBlur = glow;
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > rainCanvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  // Boot: drops start scattered over the screen, plus a few warm-up steps so trails exist.
  sizeRain();
  for (let i = 0; i < 12; i++) drawRain();

  let rainRaf = 0, lastStep = 0;
  function rainFrame(t) {
    rainRaf = requestAnimationFrame(rainFrame);
    const step = motionQuery && motionQuery.matches ? REDUCED_STEP_MS : STEP_MS;
    if (t - lastStep < step) return;
    lastStep = t;
    drawRain();
  }
  function startRain() { if (!rainRaf) { lastStep = 0; rainRaf = requestAnimationFrame(rainFrame); } }
  function stopRain() { cancelAnimationFrame(rainRaf); rainRaf = 0; }
  document.addEventListener('visibilitychange', () => { document.hidden ? stopRain() : startRain(); });
  if (!document.hidden) startRain();

  let resizeQueued = false;
  function onViewportChange() {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; sizeRain(); });
  }
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);

  // ====== Chat ======
  const log = document.getElementById('log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const history = []; // {role:'user'|'assistant', content}

  async function api(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error((data.error && data.error.message) || (typeof data.error === 'string' ? data.error : '') || `Request failed (${res.status})`);
      err.status = res.status;
      err.code = data.error && data.error.code;
      err.retryAfter = (data.error && data.error.retry_after) || Number(res.headers.get('retry-after')) || 0;
      err.data = data;
      throw err;
    }
    return data;
  }

  function setOnline(ok) {
    statusDot.classList.toggle('off', !ok);
    statusText.textContent = ok ? 'secure channel' : 'signal lost';
  }

  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function addMessage(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    log.appendChild(el);
    scrollDown();
    return el;
  }

  // Editable power card. power = Prophet suggestion (prefilled) or null (blank "add your own").
  const NAME_MIN = 2, NAME_MAX = 80, DESC_MAX = 500;
  function cleanField(v) { return v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '').trim(); }

  function addPowerCard(power, opts = {}) {
    const own = !power;
    const card = document.createElement('div');
    card.className = 'power-card' + (own ? ' own' : '');
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = own ? 'FORGE YOUR OWN POWER' : 'NEW SUPERPOWER FORGED · EDIT BEFORE SAVING';

    const nameLabel = document.createElement('label');
    nameLabel.className = 'field';
    nameLabel.textContent = 'NAME';
    const nameIn = document.createElement('input');
    nameIn.type = 'text';
    nameIn.className = 'power-name';
    nameIn.maxLength = NAME_MAX;
    nameIn.autocomplete = 'off';
    nameIn.placeholder = 'e.g. Spoon Echo';
    nameIn.value = own ? '' : String(power.name || '').slice(0, NAME_MAX);
    nameLabel.appendChild(nameIn);

    const descLabel = document.createElement('label');
    descLabel.className = 'field';
    descLabel.textContent = 'DESCRIPTION';
    const descIn = document.createElement('textarea');
    descIn.className = 'power-desc';
    descIn.maxLength = DESC_MAX;
    descIn.rows = 3;
    descIn.placeholder = 'What does this gloriously useless power do?';
    descIn.value = own ? '' : String(power.description || '').slice(0, DESC_MAX);
    descLabel.appendChild(descIn);
    const count = document.createElement('div');
    count.className = 'count';
    const updateCount = () => { count.textContent = descIn.value.length + '/' + DESC_MAX; };
    updateCount();
    descIn.addEventListener('input', updateCount);

    const meta = document.createElement('div');
    meta.className = 'meta';
    if (!own) meta.textContent = [
      power.weakness ? 'Weakness: ' + power.weakness : '',
      power.level ? 'Power level: ' + power.level + '/10' : ''
    ].filter(Boolean).join('  ·  ');

    const err = document.createElement('div');
    err.className = 'err';
    err.setAttribute('role', 'status');

    const actions = document.createElement('div');
    actions.className = 'actions';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'save-power';
    btn.textContent = 'SAVE TO VAULT';
    actions.appendChild(btn);
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'ghost cancel-power';
    cancel.textContent = own ? 'CANCEL' : 'DISMISS';
    cancel.addEventListener('click', () => card.remove());
    actions.appendChild(cancel);

    const setBusy = busy => { nameIn.disabled = busy; descIn.disabled = busy; btn.disabled = busy; cancel.disabled = busy; };

    btn.addEventListener('click', async () => {
      err.textContent = '';
      const name = cleanField(nameIn.value).replace(/\s+/g, ' ');
      const description = cleanField(descIn.value);
      if (name.length < NAME_MIN || name.length > NAME_MAX) { err.textContent = 'Name must be ' + NAME_MIN + '–' + NAME_MAX + ' characters.'; nameIn.focus(); return; }
      if (!description) { err.textContent = 'Give it a description (up to ' + DESC_MAX + ' characters).'; descIn.focus(); return; }
      if (description.length > DESC_MAX) { err.textContent = 'Description must be at most ' + DESC_MAX + ' characters.'; descIn.focus(); return; }
      setBusy(true);
      btn.textContent = 'SAVING...';
      try {
        const data = await api('/api/powers', { method: 'POST', body: JSON.stringify({ name, description }) });
        const savedName = (data.power && data.power.name) || name;
        nameIn.value = savedName;
        btn.textContent = 'SAVED ✓';
        cancel.remove();
        card.classList.add('saved');
        label.textContent = 'SAVED TO THE VAULT';
        nameIn.disabled = true; descIn.disabled = true; btn.disabled = true;
        onPowerSaved();
      } catch (e) {
        setBusy(false);
        btn.textContent = 'SAVE TO VAULT';
        if (e.status === 409) err.textContent = e.message + ' Rename it and try again.';
        else if (e.status === 429) err.textContent = 'The vault needs a breather. Try again in ' + (e.retryAfter || 60) + ' seconds.';
        else if (e.status === 400) err.textContent = e.message;
        else err.textContent = 'Could not save: ' + e.message;
        if (e.status === 409) { nameIn.focus(); nameIn.select(); }
      }
    });

    card.append(label, nameLabel, descLabel, count);
    if (meta.textContent) card.appendChild(meta);
    card.append(err, actions);
    log.appendChild(card);
    scrollDown();
    if (own && opts.focus !== false) nameIn.focus({ preventScroll: true });
    return card;
  }

  // Existing vault powers the Prophet found (read-only; tap one to open it in the vault).
  function addMatches(matches, total) {
    const box = document.createElement('div');
    box.className = 'matches';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'FROM THE VAULT · ' + matches.length + ' FOUND' + (typeof total === 'number' ? ' OF ' + total : '');
    box.appendChild(label);
    matches.forEach(m => {
      const item = document.createElement('div');
      item.className = 'match';
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.title = 'Show in the Power Vault';
      const h4 = document.createElement('h4');
      h4.textContent = m.name;
      const p = document.createElement('p');
      p.textContent = m.description;
      item.append(h4, p);
      const open = () => showInVault(m.name);
      item.addEventListener('click', open);
      item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      box.appendChild(item);
    });
    log.appendChild(box);
    scrollDown();
  }

  async function send(text) {
    addMessage('user', text);
    history.push({ role: 'user', content: text });
    sendBtn.disabled = true;
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.textContent = 'The Prophet is channeling';
    log.appendChild(typing);
    scrollDown();

    try {
      const data = await api('/api/chat', {
        method: 'POST',
        body: JSON.stringify({ message: text, history: history.slice(0, -1).slice(-10) })
      });
      typing.remove();
      setOnline(true);
      markUnread();
      const reply = (data.reply || '').trim();
      if (reply) {
        addMessage('assistant', reply);
        history.push({ role: 'assistant', content: reply });
      }
      if (data.saved_power && data.saved_power.name) { addMessage('system', 'Saved to the vault: ' + data.saved_power.name); onPowerSaved(); }
      else if (data.duplicate_of && data.duplicate_of.name) addMessage('system', 'The vault already holds: ' + data.duplicate_of.name);
      else if (data.suggested_power && data.suggested_power.name) addPowerCard(data.suggested_power);
      if (Array.isArray(data.matches) && data.matches.length) addMatches(data.matches.slice(0, 8), data.total_powers);
      if (typeof data.total_powers === 'number') setCount(data.total_powers);
    } catch (err) {
      typing.remove();
      if (err.status === 429) addMessage('system', 'The Prophet needs a breather. Try again in ' + (err.retryAfter || 60) + ' seconds.');
      else if (err.status === 400) addMessage('system', err.message);
      else { setOnline(false); addMessage('system', "Can't reach The Prophet's worker: " + err.message); }
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    input.style.height = '46px';
    send(text);
  });

  // Enter sends, Shift+Enter = newline; textarea grows with content
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener('input', () => {
    input.style.height = '46px';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  // ====== Collapsible chat (mobile only, <=860px) ======
  const chatEl = document.querySelector('.chat');
  const chatHead = chatEl.querySelector('.chat-head');
  const chatNew = document.getElementById('chat-new');
  const mobileQuery = window.matchMedia('(max-width: 860px)');
  let chatOpen = true;
  function setChatOpen(open) {
    chatOpen = open;
    const mobile = mobileQuery.matches;
    chatEl.classList.toggle('collapsed', mobile && !open);
    if (mobile) chatHead.setAttribute('aria-expanded', String(open));
    if (open) { chatNew.classList.remove('on'); chatHead.removeAttribute('aria-description'); scrollDown(); }
  }
  function applyChatMode() {
    if (mobileQuery.matches) {
      chatHead.setAttribute('role', 'button');
      chatHead.tabIndex = 0;
      chatHead.setAttribute('aria-controls', 'chat-body');
      chatHead.setAttribute('aria-label', 'Toggle chat with The Prophet');
      setChatOpen(chatOpen);
    } else {   // desktop: always open, no toggle
      ['role', 'tabindex', 'aria-controls', 'aria-expanded', 'aria-label'].forEach(a => chatHead.removeAttribute(a));
      chatEl.classList.remove('collapsed');
      chatNew.classList.remove('on');
    }
  }
  chatHead.addEventListener('click', () => { if (mobileQuery.matches) setChatOpen(!chatOpen); });
  chatHead.addEventListener('keydown', e => {
    if (!mobileQuery.matches || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); setChatOpen(!chatOpen);
  });
  if (mobileQuery.addEventListener) mobileQuery.addEventListener('change', applyChatMode); else mobileQuery.addListener(applyChatMode);
  applyChatMode();
  function markUnread() {
    if (mobileQuery.matches && !chatOpen) { chatNew.classList.add('on'); chatHead.setAttribute('aria-description', 'New message from The Prophet'); }
  }

  // ====== Vault ======
  const PAGE = 24;
  const vaultToggle = document.getElementById('vault-toggle');
  const vaultBody = document.getElementById('vault-body');
  const vaultCount = document.getElementById('vault-count');
  const vaultGrid = document.getElementById('vault-grid');
  const vaultStatus = document.getElementById('vault-status');
  const vaultSearch = document.getElementById('vault-search');
  const moreBtn = document.getElementById('vault-more');
  const vault = { open: false, loaded: false, q: '', random: false, cursor: null, shown: 0, total: null, req: 0 };

  function setCount(n) {
    if (typeof n === 'number') vault.total = n;
    vaultCount.textContent = typeof vault.total === 'number' ? '(' + vault.total + ')' : '';
  }

  function emptyNote(text) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = text;
    vaultGrid.appendChild(p);
  }

  function renderPower(p) {
    const item = document.createElement('div');
    item.className = 'vault-item';
    const h4 = document.createElement('h4');
    h4.textContent = p.name;
    const desc = document.createElement('p');
    desc.textContent = p.description;
    item.append(h4, desc);
    const metaText = [p.level ? 'LVL ' + p.level : '', p.weakness ? 'Weak: ' + p.weakness : ''].filter(Boolean).join('  ·  ');
    if (metaText) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = metaText;
      item.appendChild(meta);
    }
    vaultGrid.appendChild(item);
  }

  // Header count only (cheap): limit=1, no search.
  async function loadCount() {
    try { const data = await api('/api/powers?limit=1'); setCount(data.total); } catch (_) { /* header just stays blank */ }
  }

  // append=false starts a fresh list (search / shuffle / refresh); append=true = LOAD MORE.
  async function loadVault(append = false) {
    const id = ++vault.req;
    const params = new URLSearchParams({ limit: String(PAGE) });
    if (vault.q) params.set('q', vault.q);
    if (vault.random) params.set('random', '1');
    else if (append && vault.cursor) params.set('cursor', String(vault.cursor));
    moreBtn.disabled = true;
    if (!append) vaultStatus.textContent = 'Consulting the vault...';
    try {
      const data = await api('/api/powers?' + params.toString());
      if (id !== vault.req) return; // a newer request won
      vault.loaded = true;
      if (!append) { vaultGrid.textContent = ''; vault.shown = 0; }
      const powers = data.powers || [];
      powers.forEach(renderPower);
      vault.shown += powers.length;
      vault.cursor = data.next_cursor || null;
      const total = typeof data.total === 'number' ? data.total : vault.shown;
      if (!vault.q) setCount(total);
      if (!vault.shown) {
        emptyNote(vault.q ? 'The Prophet knows no such power. Yet.' : 'The vault is empty. Forge your first power above.');
        vaultStatus.textContent = vault.q ? 'No matches for "' + vault.q + '"' : '';
      } else if (vault.random) {
        vaultStatus.textContent = 'Shuffled ' + vault.shown + ' of ' + total + (vault.q ? ' matching "' + vault.q + '"' : '');
      } else {
        vaultStatus.textContent = 'Showing ' + vault.shown + ' of ' + total + (vault.q ? ' matching "' + vault.q + '"' : '');
      }
      moreBtn.hidden = !vault.cursor;
    } catch (err) {
      if (id !== vault.req) return;
      if (!append) { vaultGrid.textContent = ''; vault.shown = 0; moreBtn.hidden = true; }
      vaultStatus.textContent = '';
      emptyNote('Vault offline: ' + err.message);
    } finally {
      if (id === vault.req) moreBtn.disabled = false;
    }
  }

  function setVaultOpen(open) {
    vault.open = open;
    vaultToggle.setAttribute('aria-expanded', String(open));
    vaultBody.hidden = !open;
    if (open && !vault.loaded) loadVault();
  }

  vaultToggle.addEventListener('click', () => setVaultOpen(!vault.open));

  let searchTimer = null;
  vaultSearch.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = vaultSearch.value.replace(/\s+/g, ' ').trim().slice(0, 60);
      if (q === vault.q && !vault.random) return;
      vault.q = q; vault.random = false; vault.cursor = null;
      loadVault();
    }, 300);
  });
  vaultSearch.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });

  document.getElementById('shuffle-vault').addEventListener('click', () => {
    vault.random = true; vault.cursor = null;
    loadVault();
  });
  document.getElementById('refresh-vault').addEventListener('click', () => {
    clearTimeout(searchTimer);
    vaultSearch.value = '';
    vault.q = ''; vault.random = false; vault.cursor = null;
    loadVault();
  });
  moreBtn.addEventListener('click', () => { if (vault.cursor && !vault.random) loadVault(true); });

  // Open the vault filtered to one power (from a chat match).
  function showInVault(name) {
    const q = String(name).replace(/\s+/g, ' ').trim().slice(0, 60);
    clearTimeout(searchTimer);
    vaultSearch.value = q;
    vault.q = q; vault.random = false; vault.cursor = null;
    vault.open = true;
    vaultToggle.setAttribute('aria-expanded', 'true');
    vaultBody.hidden = false;
    loadVault();
    vaultToggle.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('add-own').addEventListener('click', () => addPowerCard(null));

  // After a power is saved: refresh the count, and the list if it's open.
  function onPowerSaved() {
    loadCount();
    if (vault.open) { vault.random = false; vault.cursor = null; loadVault(); }
    else vault.loaded = false;
  }

  // ====== Boot ======
  addMessage('assistant', "I am The Prophet. Tell me what kind of power you've always wanted, and we'll forge it together. When it's ready, edit it and save it to the vault. Ask me what's already in the vault, or add your own power.");
  loadCount();
</script>
</body>
</html>
